<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Chooser — Tirage au sort</title>

<!-- ===== PWA / iOS ===== -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0c14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chooser">

<link rel="apple-touch-icon" href="icon-192.png">
<link rel="apple-touch-icon" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="512x512" href="icon-512.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">

<style>
/* ===================== RESET & BASE ===================== */
*, *::before, *::after {
  box-sizing: border-box; margin: 0; padding: 0;
  -webkit-tap-highlight-color: transparent;
}

/* Verrouillage total du viewport : plus de scroll parasite / rubber-band iOS */
html, body {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  overscroll-behavior: none;
  background: #0b0c14;
  color: #eef0ff;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  touch-action: manipulation;
  -webkit-text-size-adjust: 100%;
}
input, textarea { user-select: text; -webkit-user-select: text; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }

:root{
  --bg-dark:#0b0c14;
  --bg-panel: rgba(255,255,255,0.04);
  --bg-panel-strong: rgba(255,255,255,0.07);
  --border-soft: rgba(255,255,255,0.09);
  --neon-cyan:#00f5ff;
  --neon-pink:#ff2fe0;
  --neon-green:#39ff88;
  --neon-purple:#b026ff;
  --neon-yellow:#f4ff2f;
  --danger:#ff4d6d;
  --text-dim:#8890b5;
  --circ: 339.292;

  /* Safe areas iPhone 15 : ~59px en haut (Dynamic Island), 34px en bas */
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px);
  --sar: env(safe-area-inset-right, 0px);
}

/* ===================== LAYOUT GLOBAL ===================== */
#app {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;

  /* Respect des zones système (Dynamic Island + barre d'accueil) */
  padding-top: var(--sat);
  padding-bottom: var(--sab);
  padding-left: var(--sal);
  padding-right: var(--sar);

  background:
    radial-gradient(circle at 15% 10%, rgba(176,38,255,0.18), transparent 45%),
    radial-gradient(circle at 85% 90%, rgba(0,245,255,0.15), transparent 45%),
    var(--bg-dark);
}

/* ---- Topbar (compacte, hauteur fixe) ---- */
.topbar {
  flex: 0 0 auto;
  min-height: 52px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 8px 16px;
  border-bottom: 1px solid var(--border-soft);
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
}
.topbar h1 {
  font-size: 1.05rem;
  font-weight: 800;
  letter-spacing: 1px;
  white-space: nowrap;
  background: linear-gradient(90deg, var(--neon-cyan), var(--neon-pink));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.winners-control { display: flex; align-items: center; gap: 8px; }
.winners-control label {
  font-size: 0.62rem; color: var(--text-dim);
  text-transform: uppercase; letter-spacing: 0.6px; white-space: nowrap;
}
.stepper {
  display: flex; align-items: center; gap: 6px;
  background: var(--bg-panel-strong);
  border: 1px solid var(--border-soft);
  border-radius: 999px;
  padding: 3px 5px;
}
/* Cibles tactiles >= 34px pour le pouce */
.stepper-btn {
  width: 34px; height: 34px; border-radius: 50%;
  background: rgba(255,255,255,0.08);
  font-size: 1.1rem; font-weight: 700; line-height: 1;
  display: flex; align-items: center; justify-content: center;
  transition: transform .15s ease, background .15s ease;
}
.stepper-btn:active { transform: scale(0.85); background: var(--neon-cyan); color: #000; }
.stepper-btn:disabled { opacity: 0.3; }
#winnersValue { min-width: 20px; text-align: center; font-weight: 700; font-size: 1rem; }

/* ---- Tabs ---- */
.tabs {
  flex: 0 0 auto;
  display: flex;
  padding: 8px 12px;
  gap: 8px;
}
.tab-btn {
  flex: 1;
  min-height: 42px;
  padding: 10px 8px;
  border-radius: 12px;
  background: var(--bg-panel);
  border: 1px solid var(--border-soft);
  font-size: 0.9rem;
  font-weight: 600;
  color: var(--text-dim);
  transition: all .25s ease;
}
.tab-btn.active {
  color: #fff;
  background: linear-gradient(135deg, rgba(0,245,255,0.18), rgba(255,47,224,0.18));
  border-color: var(--neon-cyan);
  box-shadow: 0 0 18px rgba(0,245,255,0.25);
}

/* ---- Main / Panels ---- */
main { flex: 1 1 auto; position: relative; overflow: hidden; min-height: 0; }
.panel { display: none; flex-direction: column; height: 100%; }
.panel.active { display: flex; }

/* ===================== MODE TACTILE ===================== */
.touch-zone {
  flex: 1;
  position: relative;
  touch-action: none;
  overflow: hidden;
  background: repeating-radial-gradient(circle at center, rgba(255,255,255,0.015) 0, transparent 2px 40px);
}
.hint {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  color: var(--text-dim);
  font-size: 1rem;
  padding: 0 30px;
  pointer-events: none;
}
.hint b, .hint span { color: var(--neon-cyan); font-weight: 700; }

.finger-circle {
  position: absolute;
  width: 90px; height: 90px;
  border-radius: 50%;
  left: 0; top: 0;
  transform: translate(-50%, -50%);
  color: var(--c, var(--neon-cyan));
  background: currentColor;
  box-shadow: 0 0 25px 6px currentColor, 0 0 55px 18px currentColor inset;
  pointer-events: none;
  animation: pop-in .22s ease-out, pulse-circle 1.1s ease-in-out .22s infinite;
  opacity: 0.9;
  z-index: 5;
}
.finger-circle.winner { animation: winner-flash .7s ease-out forwards; z-index: 10; }
.finger-circle.loser {
  animation: none; opacity: 0.15;
  transform: translate(-50%, -50%) scale(0.6);
  transition: opacity .5s ease, transform .5s ease;
}

@keyframes pop-in {
  from { transform: translate(-50%, -50%) scale(0); opacity: 0; }
  to   { transform: translate(-50%, -50%) scale(1); opacity: 0.9; }
}
@keyframes pulse-circle {
  0%, 100% { transform: translate(-50%, -50%) scale(1); }
  50%      { transform: translate(-50%, -50%) scale(1.14); }
}
@keyframes winner-flash {
  0%   { transform: translate(-50%,-50%) scale(1);   box-shadow: 0 0 20px 6px currentColor; }
  40%  { transform: translate(-50%,-50%) scale(1.5); box-shadow: 0 0 70px 30px currentColor; }
  100% { transform: translate(-50%,-50%) scale(1.3); box-shadow: 0 0 45px 18px currentColor; }
}

/* ---- Countdown overlay ---- */
.countdown-overlay {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  z-index: 20; pointer-events: none;
}
.countdown-ring { position: relative; width: 120px; height: 120px; }
.countdown-ring svg { width: 100%; height: 100%; }
.ring-bg { fill: none; stroke: rgba(255,255,255,0.12); stroke-width: 8; }
.ring-progress {
  fill: none; stroke: var(--neon-cyan); stroke-width: 8; stroke-linecap: round;
  stroke-dasharray: var(--circ); stroke-dashoffset: var(--circ);
  transform: rotate(-90deg); transform-origin: 50% 50%;
  filter: drop-shadow(0 0 8px var(--neon-cyan));
}
.countdown-label {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  font-size: 2.2rem; font-weight: 800;
  text-shadow: 0 0 15px var(--neon-cyan);
}

/* ---- Result banner ---- */
.result-banner {
  position: absolute;
  top: 16px; left: 50%;
  transform: translateX(-50%);
  padding: 10px 22px;
  border-radius: 999px;
  background: rgba(0,0,0,0.55);
  border: 1px solid var(--neon-green);
  color: var(--neon-green);
  font-weight: 700; font-size: 0.9rem; white-space: nowrap;
  box-shadow: 0 0 20px rgba(57,255,136,0.4);
  z-index: 30;
  animation: stagger-in .4s ease-out;
}

/* ===================== MODE LISTE ===================== */
#list-panel {
  padding: 14px 16px calc(28px + var(--sab));
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  touch-action: pan-y;
}
.list-controls { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
.add-row { display: flex; gap: 8px; }
.add-row input {
  flex: 1; min-width: 0;
  padding: 12px 14px;
  border-radius: 12px;
  background: var(--bg-panel);
  border: 1px solid var(--border-soft);
  color: #fff;
  font-size: 16px; /* 16px = empêche le zoom auto au focus sur iOS */
}
.add-row input:focus { outline: none; border-color: var(--neon-cyan); }

.btn {
  padding: 12px 18px;
  border-radius: 12px;
  font-weight: 700;
  font-size: 0.9rem;
  min-height: 44px;
  transition: transform .15s ease, box-shadow .2s ease, opacity .2s ease;
}
.btn:active { transform: scale(0.96); }
.btn.primary { background: linear-gradient(135deg, var(--neon-cyan), #0090ff); color: #001018; }
.btn.secondary {
  background: var(--bg-panel-strong);
  border: 1px solid var(--border-soft);
  color: #fff; width: 100%; margin-top: 8px;
}

.bulk-import {
  background: var(--bg-panel);
  border: 1px solid var(--border-soft);
  border-radius: 12px;
  padding: 10px 14px;
}
.bulk-import summary { cursor: pointer; font-size: 0.85rem; color: var(--text-dim); }
.bulk-import textarea {
  width: 100%; margin-top: 10px; padding: 10px;
  border-radius: 10px;
  background: rgba(0,0,0,0.3);
  border: 1px solid var(--border-soft);
  color: #fff; resize: vertical;
  font-family: inherit; font-size: 16px;
}

.participants-list {
  list-style: none;
  display: flex; flex-direction: column; gap: 8px;
  margin-bottom: 8px;
}
.participant-item {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 12px 14px;
  background: var(--bg-panel);
  border: 1px solid var(--border-soft);
  border-radius: 12px;
  animation: stagger-in .3s ease-out;
}
.p-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.p-remove {
  flex: 0 0 auto;
  width: 32px; height: 32px; border-radius: 50%;
  background: rgba(255,77,109,0.15);
  color: var(--danger); font-size: 1rem; line-height: 1;
  display: flex; align-items: center; justify-content: center;
}
.p-remove:active { transform: scale(0.85); }

.count-info { color: var(--text-dim); font-size: 0.8rem; margin: 4px 0 16px; text-align: center; }

.draw-btn {
  width: 100%; padding: 16px; font-size: 1.05rem;
  background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple));
  color: #fff;
  box-shadow: 0 0 25px rgba(255,47,224,0.35);
  border-radius: 16px;
  letter-spacing: 0.3px;
}
.draw-btn:disabled { opacity: 0.35; box-shadow: none; }

.draw-stage { margin-top: 22px; display: flex; justify-content: center; }
.draw-reel {
  min-width: 220px; max-width: 100%;
  padding: 26px 20px; text-align: center;
  font-size: 1.4rem; font-weight: 800;
  border-radius: 16px;
  background: var(--bg-panel-strong);
  border: 2px solid var(--neon-yellow);
  box-shadow: 0 0 30px rgba(244,255,47,0.3);
  overflow: hidden; text-overflow: ellipsis;
}
.draw-reel.spinning { animation: reel-shake .12s linear infinite; filter: blur(0.4px); }
@keyframes reel-shake {
  0%   { transform: translateY(0); }
  50%  { transform: translateY(-3px); }
  100% { transform: translateY(0); }
}

.winners-display {
  margin-top: 22px;
  display: flex; flex-wrap: wrap; gap: 12px; justify-content: center;
}
.winner-card {
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  padding: 16px 22px;
  border-radius: 16px;
  background: linear-gradient(160deg, rgba(57,255,136,0.15), rgba(0,245,255,0.08));
  border: 1px solid var(--neon-green);
  box-shadow: 0 0 25px rgba(57,255,136,0.25);
  opacity: 0;
  animation: stagger-in .5s ease-out forwards;
}
/* Badge de rang en remplacement de l'emoji trophée */
.winner-card .rank {
  width: 30px; height: 30px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.85rem; font-weight: 800;
  color: #001a0c;
  background: var(--neon-green);
  box-shadow: 0 0 14px rgba(57,255,136,0.6);
}
.winner-card .w-name { font-weight: 700; font-size: 1.05rem; }

@keyframes stagger-in {
  from { opacity: 0; transform: translateY(16px) scale(0.92); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

#list-panel::-webkit-scrollbar { width: 6px; }
#list-panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }

/* ---- Écrans courts (paysage / petits iPhone) ---- */
@media (max-height: 700px) {
  .topbar { min-height: 46px; padding: 6px 14px; }
  .topbar h1 { font-size: 0.95rem; }
  .tabs { padding: 6px 10px; }
  .tab-btn { min-height: 38px; padding: 8px; }
}
</style>
</head>
<body>

<div id="app">

  <!-- ===================== TOPBAR ===================== -->
  <header class="topbar">
    <h1>CHOOSER</h1>
    <div class="winners-control">
      <label for="winnersValue">Gagnants</label>
      <div class="stepper">
        <button id="decWinners" class="stepper-btn" type="button" aria-label="Diminuer">&minus;</button>
        <span id="winnersValue">1</span>
        <button id="incWinners" class="stepper-btn" type="button" aria-label="Augmenter">+</button>
      </div>
    </div>
  </header>

  <!-- ===================== TABS ===================== -->
  <nav class="tabs">
    <button class="tab-btn active" type="button" data-tab="touch">Doigts</button>
    <button class="tab-btn" type="button" data-tab="list">Liste</button>
  </nav>

  <main>
    <!-- ===================== PANEL 1 : MULTI-TOUCH ===================== -->
    <section id="touch-panel" class="panel active">
      <div id="touchZone" class="touch-zone">
        <p id="touchHint" class="hint">Posez au moins <span id="minFingersHint">2</span> doigts sur l'écran</p>

        <div id="countdownOverlay" class="countdown-overlay" hidden>
          <div class="countdown-ring">
            <svg viewBox="0 0 120 120">
              <circle class="ring-bg" cx="60" cy="60" r="54"></circle>
              <circle id="ringProgress" class="ring-progress" cx="60" cy="60" r="54"></circle>
            </svg>
            <span id="countdownLabel" class="countdown-label">3</span>
          </div>
        </div>

        <div id="resultBanner" class="result-banner" hidden></div>
      </div>
    </section>

    <!-- ===================== PANEL 2 : LISTE MANUELLE ===================== -->
    <section id="list-panel" class="panel">
      <div class="list-controls">
        <div class="add-row">
          <input type="text" id="nameInput" placeholder="Ajouter un participant" autocomplete="off" autocorrect="off" autocapitalize="words">
          <button id="addNameBtn" class="btn primary" type="button">Ajouter</button>
        </div>
        <details class="bulk-import">
          <summary>Import en masse (un nom par ligne)</summary>
          <textarea id="bulkTextarea" rows="4" placeholder="Alice&#10;Bob&#10;Charlie"></textarea>
          <button id="bulkImportBtn" class="btn secondary" type="button">Importer la liste</button>
        </details>
      </div>

      <ul id="participantsList" class="participants-list"></ul>
      <p id="participantsCount" class="count-info">0 participant</p>

      <button id="drawBtn" class="btn draw-btn" type="button" disabled>Lancer le tirage</button>

      <div id="drawStage" class="draw-stage" hidden>
        <div id="drawReel" class="draw-reel">...</div>
      </div>

      <div id="winnersDisplay" class="winners-display" hidden></div>
    </section>
  </main>

</div>

<script>
(() => {
  "use strict";

  /* ============================================================
     0. UTILITAIRES GLOBAUX
     ============================================================ */
  const CIRC = 339.292;
  const COLORS = ['#00f5ff', '#ff2fe0', '#39ff88', '#b026ff', '#ff9d2f', '#f4ff2f', '#ff4d6d', '#2fd9ff'];
  const randomColor = () => COLORS[Math.floor(Math.random() * COLORS.length)];

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function vibrate(pattern) {
    if (navigator.vibrate) navigator.vibrate(pattern);
  }

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  // Empêche le zoom pincé et le double-tap zoom (Safari iOS)
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('gesturechange', e => e.preventDefault());
  let lastTouchEnd = 0;
  document.addEventListener('touchend', e => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) e.preventDefault();
    lastTouchEnd = now;
  }, { passive: false });

  /* ============================================================
     1. GESTION DES ONGLETS
     ============================================================ */
  const tabBtns = document.querySelectorAll('.tab-btn');
  tabBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      tabBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      document.getElementById(btn.dataset.tab + '-panel').classList.add('active');
    });
  });

  /* ============================================================
     2. PARAMÈTRE GLOBAL : NOMBRE DE GAGNANTS
     ============================================================ */
  const MIN_WINNERS = 1, MAX_WINNERS = 5;
  let winnersCount = 1;

  const winnersValueEl   = document.getElementById('winnersValue');
  const decWinnersBtn    = document.getElementById('decWinners');
  const incWinnersBtn    = document.getElementById('incWinners');
  const minFingersHintEl = document.getElementById('minFingersHint');

  function setWinners(n) {
    winnersCount = Math.max(MIN_WINNERS, Math.min(MAX_WINNERS, n));
    winnersValueEl.textContent = winnersCount;
    minFingersHintEl.textContent = winnersCount + 1;
    decWinnersBtn.disabled = winnersCount <= MIN_WINNERS;
    incWinnersBtn.disabled = winnersCount >= MAX_WINNERS;
    if (!resultActive) updateHint(touchesMap.size, winnersCount + 1);
    updateDrawButtonState();
  }
  decWinnersBtn.addEventListener('click', () => setWinners(winnersCount - 1));
  incWinnersBtn.addEventListener('click', () => setWinners(winnersCount + 1));

  /* ============================================================
     3. MODE 1 — MULTI-TOUCH
     ============================================================ */
  const touchZone        = document.getElementById('touchZone');
  const touchHint        = document.getElementById('touchHint');
  const countdownOverlay = document.getElementById('countdownOverlay');
  const ringProgress     = document.getElementById('ringProgress');
  const countdownLabel   = document.getElementById('countdownLabel');
  const resultBanner     = document.getElementById('resultBanner');

  const touchesMap = new Map();
  let resultActive = false;
  let countdownTimeout = null;
  let countdownInterval = null;
  let countdownActiveCount = 0;
  const COUNTDOWN_MS = 2800;

  function getRelativePos(touch) {
    const rect = touchZone.getBoundingClientRect();
    return { x: touch.clientX - rect.left, y: touch.clientY - rect.top };
  }

  function addTouch(touch) {
    const { x, y } = getRelativePos(touch);
    const el = document.createElement('div');
    el.className = 'finger-circle';
    el.style.setProperty('--c', randomColor());
    el.style.left = x + 'px';
    el.style.top  = y + 'px';
    touchZone.appendChild(el);
    touchesMap.set(touch.identifier, { el, x, y });
  }

  function moveTouch(touch) {
    const data = touchesMap.get(touch.identifier);
    if (!data) return;
    const { x, y } = getRelativePos(touch);
    data.x = x; data.y = y;
    data.el.style.left = x + 'px';
    data.el.style.top  = y + 'px';
  }

  function fadeAndRemove(el) {
    el.style.animation = 'none';
    requestAnimationFrame(() => {
      el.style.transition = 'opacity .3s ease, transform .3s ease';
      el.style.opacity = '0';
    });
    setTimeout(() => el.remove(), 320);
  }

  function removeTouch(identifier) {
    const data = touchesMap.get(identifier);
    if (!data) return;
    fadeAndRemove(data.el);
    touchesMap.delete(identifier);
  }

  function updateHint(current, required) {
    if (resultActive) return;
    touchHint.hidden = false;
    if (current === 0) {
      touchHint.innerHTML = `Posez au moins <b>${required}</b> doigts sur l'écran`;
    } else if (current < required) {
      touchHint.innerHTML = `<b>${current}</b> doigt(s) détecté(s) — encore ${required - current} pour lancer`;
    } else {
      touchHint.hidden = true;
    }
  }

  function evaluateState() {
    if (resultActive) return;
    const required = winnersCount + 1;
    const current = touchesMap.size;
    updateHint(current, required);
    if (current >= required) {
      if (countdownActiveCount !== current) startCountdown(current);
    } else {
      cancelCountdown();
    }
  }

  function showCountdownOverlay() {
    countdownOverlay.hidden = false;
    ringProgress.style.transition = 'none';
    ringProgress.style.strokeDashoffset = CIRC;
    void ringProgress.getBoundingClientRect();
  }
  function hideCountdownOverlay() {
    countdownOverlay.hidden = true;
    ringProgress.style.transition = 'none';
    ringProgress.style.strokeDashoffset = CIRC;
  }

  function startCountdown(count) {
    clearCountdownTimers();
    countdownActiveCount = count;
    showCountdownOverlay();

    requestAnimationFrame(() => {
      ringProgress.style.transition = `stroke-dashoffset ${COUNTDOWN_MS}ms linear`;
      ringProgress.style.strokeDashoffset = '0';
    });

    let remaining = Math.ceil(COUNTDOWN_MS / 1000);
    countdownLabel.textContent = remaining;
    countdownInterval = setInterval(() => {
      remaining--;
      if (remaining > 0) countdownLabel.textContent = remaining;
    }, 1000);

    countdownTimeout = setTimeout(doDraw, COUNTDOWN_MS);
  }

  function clearCountdownTimers() {
    if (countdownTimeout) { clearTimeout(countdownTimeout); countdownTimeout = null; }
    if (countdownInterval) { clearInterval(countdownInterval); countdownInterval = null; }
  }

  function cancelCountdown() {
    clearCountdownTimers();
    countdownActiveCount = 0;
    hideCountdownOverlay();
  }

  function doDraw() {
    clearCountdownTimers();
    countdownActiveCount = 0;
    hideCountdownOverlay();

    const ids = Array.from(touchesMap.keys());
    shuffle(ids);
    const winnerIds = new Set(ids.slice(0, Math.min(winnersCount, ids.length)));

    resultActive = true;
    touchHint.hidden = true;

    ids.forEach(id => {
      const data = touchesMap.get(id);
      if (!data) return;
      data.el.classList.add(winnerIds.has(id) ? 'winner' : 'loser');
    });

    vibrate([80, 40, 80, 40, 220]);

    resultBanner.hidden = false;
    resultBanner.textContent = winnersCount > 1
      ? `${winnersCount} gagnants désignés`
      : `Gagnant désigné`;
  }

  function resetAfterResult() {
    resultActive = false;
    resultBanner.hidden = true;
    updateHint(0, winnersCount + 1);
  }

  touchZone.addEventListener('touchstart', e => {
    e.preventDefault();
    if (resultActive) return;
    for (const t of e.changedTouches) addTouch(t);
    evaluateState();
  }, { passive: false });

  touchZone.addEventListener('touchmove', e => {
    e.preventDefault();
    for (const t of e.changedTouches) moveTouch(t);
  }, { passive: false });

  function handleTouchEnd(e) {
    e.preventDefault();
    for (const t of e.changedTouches) removeTouch(t.identifier);
    if (resultActive) {
      if (touchesMap.size === 0) resetAfterResult();
    } else {
      evaluateState();
    }
  }
  touchZone.addEventListener('touchend', handleTouchEnd, { passive: false });
  touchZone.addEventListener('touchcancel', handleTouchEnd, { passive: false });

  /* ============================================================
     4. MODE 2 — LISTE MANUELLE
     ============================================================ */
  const nameInput           = document.getElementById('nameInput');
  const addNameBtn          = document.getElementById('addNameBtn');
  const bulkTextarea        = document.getElementById('bulkTextarea');
  const bulkImportBtn       = document.getElementById('bulkImportBtn');
  const participantsListEl  = document.getElementById('participantsList');
  const participantsCountEl = document.getElementById('participantsCount');
  const drawBtn             = document.getElementById('drawBtn');
  const drawStage           = document.getElementById('drawStage');
  const drawReel            = document.getElementById('drawReel');
  const winnersDisplay      = document.getElementById('winnersDisplay');

  let participants = [];
  let isDrawing = false;

  function renderParticipants() {
    participantsListEl.innerHTML = '';
    participants.forEach((name, idx) => {
      const li = document.createElement('li');
      li.className = 'participant-item';
      li.innerHTML = `<span class="p-name">${escapeHtml(name)}</span>
                      <button class="p-remove" type="button" data-idx="${idx}" aria-label="Supprimer">&times;</button>`;
      participantsListEl.appendChild(li);
    });
    participantsCountEl.textContent = `${participants.length} participant${participants.length > 1 ? 's' : ''}`;
    updateDrawButtonState();
  }

  function updateDrawButtonState() {
    drawBtn.disabled = participants.length === 0 || participants.length < winnersCount || isDrawing;
  }

  function addFromInput() {
    const val = nameInput.value.trim();
    if (!val) return;
    participants.push(val);
    nameInput.value = '';
    nameInput.focus();
    renderParticipants();
  }
  addNameBtn.addEventListener('click', addFromInput);
  nameInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); addFromInput(); }
  });

  bulkImportBtn.addEventListener('click', () => {
    const lines = bulkTextarea.value.split('\n').map(s => s.trim()).filter(Boolean);
    if (lines.length === 0) return;
    participants.push(...lines);
    bulkTextarea.value = '';
    renderParticipants();
  });

  participantsListEl.addEventListener('click', e => {
    if (e.target.classList.contains('p-remove')) {
      const idx = Number(e.target.dataset.idx);
      participants.splice(idx, 1);
      renderParticipants();
    }
  });

  function runDraw() {
    if (isDrawing || participants.length === 0 || participants.length < winnersCount) return;
    isDrawing = true;
    drawBtn.disabled = true;
    winnersDisplay.hidden = true;
    winnersDisplay.innerHTML = '';
    drawStage.hidden = false;
    drawReel.classList.add('spinning');

    const SPIN_MS = 1600;
    const spinInterval = setInterval(() => {
      drawReel.textContent = participants[Math.floor(Math.random() * participants.length)];
    }, 70);

    setTimeout(() => {
      clearInterval(spinInterval);
      drawReel.classList.remove('spinning');

      const pool = [...participants];
      shuffle(pool);
      const winners = pool.slice(0, winnersCount);
      drawReel.textContent = winners.length === 1 ? winners[0] : 'Tirage terminé';

      vibrate([100, 50, 100, 50, 250]);

      setTimeout(() => {
        drawStage.hidden = true;
        showWinners(winners);
        isDrawing = false;
        updateDrawButtonState();
      }, 500);
    }, SPIN_MS);
  }
  drawBtn.addEventListener('click', runDraw);

  function showWinners(winners) {
    winnersDisplay.hidden = false;
    winnersDisplay.innerHTML = '';
    winners.forEach((name, i) => {
      const card = document.createElement('div');
      card.className = 'winner-card';
      card.style.animationDelay = `${i * 0.15}s`;
      card.innerHTML = `<span class="rank">${i + 1}</span><span class="w-name">${escapeHtml(name)}</span>`;
      winnersDisplay.appendChild(card);
    });
    winnersDisplay.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  /* ============================================================
     5. INITIALISATION
     ============================================================ */
  setWinners(1);
  updateHint(0, winnersCount + 1);
  renderParticipants();

})();
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(console.error);
    });
  }
</script>
</body>
